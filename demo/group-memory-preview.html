<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whale · 群记忆工作台预览</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#263d3b;background:#f3f1e9}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1250px;margin:auto}h1{font-size:28px;margin:0 0 8px}p{line-height:1.6}button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.muted{color:#6e7972;font-size:14px}.chip{display:inline-block;background:#e3efea;color:#42675b;border-radius:30px;padding:5px 10px;margin:3px;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 14px}.toolbar button{border:1px solid #9bb4a6;background:#fff;border-radius:12px;padding:10px 15px}.toolbar button.primary{background:#3d7563;color:#fff;border-color:#3d7563}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:14px}.card{background:#fffdfa;border:1px solid #dfe4d9;border-radius:20px;padding:18px;box-shadow:0 6px 24px #2b4d3a0a}.graph{width:100%;min-width:570px}.graphwrap{overflow-x:auto}.node{cursor:pointer}.node:focus{outline:none}.node circle{stroke:#fff;stroke-width:4}.node.selected circle{stroke:#263d3b}.detail{min-height:230px}.quote{border-left:3px solid #66aa91;padding-left:12px}.segments{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}.msg{display:block;text-align:left;width:100%;border:0;background:none;padding:8px;border-radius:8px}.msg:hover{background:#f1f5ef}.status{background:#e9f4ed;border-radius:12px;padding:12px;margin-top:8px}.small{font-size:12px;color:#707a73}@media(max-width:800px){body{padding:18px}.grid,.segments{grid-template-columns:1fr}}
</style></head><body><div class="head"><div><h1>群记忆工作台</h1><p class="muted">虚构项目群 · 群消息分段 → 手动整合 → 画像与事实 → 更正／撤销 → 证据核查</p></div><span class="chip">独立预览 · 不读真实聊天</span></div>
<div class="toolbar"><button id="refresh" class="primary">手动整合</button><button id="correct">加入更正消息</button><button id="revoke">加入撤销消息</button><button id="reset">重置</button><span id="notice" class="muted"></span></div>
<div class="grid"><section class="card"><b>二维记忆图谱</b><span class="muted"> · 点击节点看详情</span><div class="graphwrap"><svg id="graph" class="graph" viewBox="0 0 800 470" role="img" aria-label="群、成员、记忆和证据的关系"></svg></div><div id="current" class="status"></div><div id="reminder" class="status"></div></section><aside class="card detail"><b>节点详情</b><div id="detail"></div></aside></div><div id="segments" class="segments"></div>
<script type="module">
import {freshGroupDemo,stageGroupMessage,refreshGroupDemo,segmentGroupMessages,currentGroupMemories} from '../lib/group-memory-demo.js';
let data=freshGroupDemo(),selected='group',notice='群消息已备好；点击「手动整合」形成记忆';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>new Date(ms).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function render(){
 const pending=data.messages.filter(m=>!data.processed.includes(m.id)).length,old=data.memories.find(m=>m.id==='meeting-v1'),newer=data.memories.find(m=>m.id==='meeting-v2'),active=currentGroupMemories(data);
 $('refresh').textContent=`手动整合（${pending} 条待处理）`;$('correct').disabled=old?.status!=='active'||data.messages.some(m=>m.id==='g5');$('revoke').disabled=newer?.status!=='active'||data.messages.some(m=>m.id==='g6');$('notice').textContent=notice;
 $('current').innerHTML=`<b>当前可用记忆：</b>${esc(active.map(m=>m.summary).join('；')||'暂无')}`;
 $('reminder').innerHTML=`<b>演示中的提醒判断：</b>${active.some(m=>m.slot==='meeting')?'可依据当前项目讨论安排准备提醒':data.memories.some(m=>m.slot==='meeting')?'讨论已撤销，不再依据旧安排提醒':'尚无已整合的讨论安排'}`;
 const pts=data.memories.map((m,i)=>({...m,x:360,y:90+i*125}));let svg='';
 for(const m of pts){svg+=`<path d="M 140 ${m.subject==='小禾'?350:180} Q 235 ${m.y} 300 ${m.y} M 420 ${m.y} L 610 ${m.y}" fill="none" stroke="#b8c5c0" stroke-width="2"/>`;if(m.previous){const prev=pts.find(x=>x.id===m.previous);svg+=`<path d="M 360 ${prev?.y||90} L 360 ${m.y}" fill="none" stroke="#b8c5c0" stroke-dasharray="5 5"/>`;}}
 const nodes=[{id:'group',x:94,y:180,label:'项目群',color:'#5e8175'},{id:'member',x:94,y:350,label:'小禾',color:'#8a769a'},...pts.map(m=>({id:m.id,x:m.x,y:m.y,label:m.id==='member-preference'?'表达偏好':m.id==='meeting-v1'?'原安排':'更正安排',color:{active:'#427a69',superseded:'#b88245',revoked:'#a87171'}[m.status]})),...pts.map(m=>({id:'source-'+m.evidence,x:670,y:m.y,label:'原话证据',color:'#aa8a61'}))];
 for(const n of nodes)svg+=`<g class="node ${selected===n.id?'selected':''}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="查看${esc(n.label)}"><circle cx="${n.x}" cy="${n.y}" r="46" fill="${n.color}"/><text x="${n.x}" y="${n.y+5}" fill="white" text-anchor="middle" font-size="15">${esc(n.label)}</text></g>`;$('graph').innerHTML=svg;
 const source=data.messages.find(m=>'source-'+m.id===selected),memory=data.memories.find(m=>m.id===selected);
 $('detail').innerHTML=source?`<p><b>${esc(source.author)}</b> · ${fmt(source.time)}</p><p class="quote">${esc(source.text)}</p><p class="small">虚构项目群 · 消息 ${esc(source.id)}</p>`:memory?`<p><b>${esc(memory.summary)}</b></p><p>类型：${esc(memory.kind)} · 状态：${memory.status==='active'?'当前有效':memory.status==='superseded'?'已被更正':'已撤销'}</p><p class="small">主体：${esc(memory.subject)}</p><button data-node="source-${esc(memory.evidence)}">查看来源原话</button>${memory.changedBy?` <button data-node="source-${esc(memory.changedBy)}">查看更正／撤销原话</button>`:''}`:selected==='member'?'<p>小禾的群内自述形成一条表达偏好：先看图，再讨论细节；不推测性格</p><button data-node="source-g2">查看原话</button>':'<p>群公共事实和成员公开自述分别保存；旧版本留在图中，但退出当前可用记忆</p>';
 $('segments').innerHTML=segmentGroupMessages(data.messages).map((s,i)=>`<section class="card"><b>对话段 ${i+1}</b><span class="small"> · ${s.messages.length} 条消息</span><div>${s.keywords.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>${s.messages.map(m=>`<button class="msg" data-node="source-${esc(m.id)}"><b>${esc(m.author)}</b> · ${fmt(m.time)} · ${esc(m.text)}</button>`).join('')}</section>`).join('');
}
document.addEventListener('click',e=>{const node=e.target.closest('[data-node]');if(node){selected=node.dataset.node;render();}});$('graph').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const node=e.target.closest('[data-node]');if(node){selected=node.dataset.node;render();}}});
$('refresh').onclick=()=>{data=refreshGroupDemo(data);notice=data.lastRefresh.processed?`已整合 ${data.lastRefresh.processed} 条新消息；再次刷新不会重复写入`:'没有新消息，本次没有重复写入';render();};$('correct').onclick=()=>{data=stageGroupMessage(data,'correction');notice='更正消息已进入群聊，点击「手动整合」更新事实';render();};$('revoke').onclick=()=>{data=stageGroupMessage(data,'revoke');notice='撤销消息已进入群聊，点击「手动整合」使当前安排失效';render();};$('reset').onclick=()=>{data=freshGroupDemo();selected='group';notice='演示已重置';render();};render();
</script></body></html>
